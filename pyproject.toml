[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "production-rag-system"
version = "0.1.0"
description = "Production-oriented RAG system"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "google-genai>=1.0,<2",
  "groq>=0.31,<1",
  "pymupdf>=1.28,<2",
  "sentence-transformers>=3,<6",
  "streamlit>=1.57,<2",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
